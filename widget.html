<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#0a1427;color:#fff;font:14px system-ui}.wrap{height:145px;padding:15px;border:1px solid #d4a85b70;border-radius:15px;background:linear-gradient(125deg,#152f4a,#0b1427);display:flex;align-items:center;gap:14px}.info{flex:1;min-width:0}.label{font-size:10px;letter-spacing:1.5px;color:#edc57f}.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:7px 0}.group{color:#a9bed5;font-size:11px}button{background:#eac17a;border:0;border-radius:50%;height:52px;width:52px;font-size:22px;cursor:pointer}a{color:#eac17a;font-size:11px}#status{color:#a9bed5;font-size:10px;margin-top:5px}</style></head><body><div class="wrap"><div class="info"><div class="label">◉ OTIS INSPIRATIONAL RADIO</div><div class="title" id="title">Loading music…</div><div class="group" id="group">On-demand listening</div><div id="status"></div><a href="/" target="_blank" rel="noopener">Open full radio ↗</a></div><button id="play" aria-label="Play or pause">▶</button></div><audio id="audio" preload="metadata"></audio><script>const a=document.getElementById('audio'),p=document.getElementById('play'),s=document.getElementById('status');let tracks=[],i=0,tried=false;function set(){const t=tracks[i];a.src='/'+t.url.split('/').pop();document.getElementById('title').textContent=t.title;document.getElementById('group').textContent=t.group}p.onclick=async()=>{if(a.paused){try{await a.play()}catch{s.textContent='Unable to play this MP3.'}}else a.pause()};a.onplay=()=>p.textContent='Ⅱ';a.onpause=()=>p.textContent='▶';a.onended=()=>{i=(i+1)%tracks.length;tried=false;set();a.play().catch(()=>{})};a.onerror=()=>{if(!tried&&tracks.length){tried=true;a.src='/music/'+tracks[i].url.split('/').pop();a.play().catch(()=>{})}else s.textContent='MP3 not found. Check GitHub file path.'};fetch('/playlist.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(j=>{tracks=Array.isArray(j)?j:j.tracks;set();s.textContent=tracks.length+' songs ready'}).catch(()=>s.textContent='Playlist unavailable');</script></body></html>
