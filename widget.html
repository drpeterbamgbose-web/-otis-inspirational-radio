<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OTIS Radio Widget</title><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui,Arial;background:transparent;color:#fff}.widget{min-height:108px;background:linear-gradient(120deg,#08142d,#20355e);border:1px solid #e7b961;border-radius:15px;padding:13px;display:flex;align-items:center;justify-content:space-between;gap:12px}.name{font-weight:850;color:#ffdc8c;font-size:16px}.sub{font-size:12px;color:#bfcfe6;margin-top:5px}.actions{display:flex;gap:8px;align-items:center}a,button{border-radius:30px;border:1px solid #ffdc8c;padding:10px;color:#06122a;background:#ffcf70;font-weight:750;text-decoration:none;white-space:nowrap;cursor:pointer}a{background:transparent;color:#ffdc8c}button:disabled{opacity:.5;cursor:not-allowed}@media(max-width:430px){.name{font-size:13px}.sub{font-size:10px}.widget{padding:9px}.actions{gap:4px}a,button{padding:8px;font-size:11px}}</style></head><body><div class="widget"><div><div class="name">🎙 OTIS Inspirational Radio</div><div class="sub" id="state">Loading published playlist…</div></div><div class="actions"><button id="play" disabled title="Play or pause">▶</button><a href="./index.html" target="_blank" rel="noopener">Open Radio ↗</a></div></div><audio id="audio" preload="none"></audio><script>
const a=document.getElementById('audio'),b=document.getElementById('play'),s=document.getElementById('state');let tracks=[],idx=0;
(async()=>{try{const r=await fetch('./playlist.json',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();const items=Array.isArray(d)?d:d.tracks;tracks=items.map(t=>{try{const u=new URL(t.url,location.href);return u.protocol==='https:'?{title:t.title||'OTIS Music',url:u.href}:null}catch{return null}}).filter(Boolean);if(!tracks.length){s.textContent='Songs coming soon · Open Radio';return}a.src=tracks[0].url;b.disabled=false;s.textContent='Ready: '+tracks[0].title}catch{s.textContent='Open the radio to listen'}})();
b.onclick=()=>{if(a.paused)a.play().catch(()=>s.textContent='Playback unavailable');else a.pause()};a.onplay=()=>{b.textContent='Ⅱ';s.textContent='Playing: '+tracks[idx].title};a.onpause=()=>b.textContent='▶';a.onended=()=>{idx=(idx+1)%tracks.length;a.src=tracks[idx].url;a.play().catch(()=>s.textContent='Tap play to continue')};a.onerror=()=>s.textContent='Audio unavailable · Open Radio';
</script></body></html>
